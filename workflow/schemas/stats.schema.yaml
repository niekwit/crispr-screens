$schema: "http://json-schema.org/draft-06/schema#"

description: CSV file for pairwise comparisons with MAGeCK and/or BAGEL2
properties:
  test:
    type: string
    pattern: "^[a-zA-Z0-9_;].+$"
    description: Test sample
  control:
    type: string
    pattern: "^[a-zA-Z0-9_;].+$"
    description: Control sample
  bagel2_only:
    type: string
    pattern: "^[yYnN]$"
    description: >
      Optional. If this column is present anywhere in the file, it is a
      strict split: rows marked "y" are analysed only with BAGEL2 (and
      CRISPRcleanR), and all other rows ("n" or blank) only with MAGeCK
      and DrugZ. Useful when BAGEL2 needs a different comparison than
      MAGeCK/DrugZ (eg. against a plasmid/reference sample). If the
      column is absent entirely, every row is analysed with all three
      tools (the default).
  condition:
    type: [string, number]
    description: >
      Optional. Condition of the comparison (eg. control, mutant). If this
      column and/or time_point is present, the QC report's CRISPRcleanR
      ROC/PR curves get one panel per condition.
  time_point:
    type: number
    description: >
      Optional. Time point of the comparison (eg. days after transduction).
      If present, the QC report's CRISPRcleanR ROC/PR curves are coloured
      by time point (light = earliest, dark = latest).

required:
  - test
  - control